<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Таймаут</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --a1:#FF8A3D;          /* верх градиента кнопки */
  --a2:#F2542D;          /* низ градиента кнопки */
  --acc:#D66E4C;         /* терракота: кольцо, активные плашки, акценты */
  --acc-soft:#FBF0EC;
  --ink:#16130F;
  --ink-2:#6E747E;
  --ink-3:#A2A7AF;
  --ink-4:#C6CAD0;
  --line:#EEF0F2;
  --surface:#FFFFFF;
  --soft:#F7F8F9;
  --shadow:0 10px 28px rgba(25,28,36,.14);
  --r-card:22px;
  --r-tile:15px;
  --r-pill:100px;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--surface);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px;color:inherit}
svg{display:block;flex:none}

/* ══ шапка с фото ══ */
.hero{position:relative;background-size:cover;background-position:50% 50%;height:200px}
.hero .hd{position:absolute;left:20px;right:20px;top:calc(18px + env(safe-area-inset-top));color:#fff;
  text-shadow:0 1px 14px rgba(0,0,0,.5)}
.hero .brand{font-size:10px;letter-spacing:.24em;text-transform:uppercase;opacity:.94}
.hero h1{font-size:27px;font-weight:800;letter-spacing:-.03em;margin:4px 0 0;line-height:1.08}
.strip{padding:calc(7px + env(safe-area-inset-top)) 20px 7px;background:#F7E7DF;
  color:#8A4A32;font-size:11.5px;line-height:1.35}

/* ══ карточка недели ══ */
.ring{position:relative;margin:-40px 16px 0;background:var(--surface);border-radius:var(--r-card);
  padding:14px 14px 13px;box-shadow:var(--shadow);z-index:3}
.rtop{display:flex;align-items:center;gap:13px}
.ring .sic{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--acc-soft);color:var(--acc)}
.ring .k{font-size:10px;color:var(--ink-3)}
.ring .big{font-size:16.5px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
.ring .sm{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.rbot{display:flex;gap:6px;margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}

/* ── плашки мест: активная = двойное кольцо + подъём ── */
.rb{position:relative;flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-tile);
  padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.15;
  color:var(--ink-4);transition:.16s}
.rb span{font-size:9px;font-weight:700;letter-spacing:-.01em;color:var(--ink-3)}
.rb i{font-style:normal;font-size:10px;font-weight:800;color:var(--ink-4)}
.rb.on{color:var(--acc);border:2px solid var(--acc);transform:translateY(-4px);
  box-shadow:0 0 0 4px rgba(214,110,76,.16), 0 12px 22px -5px rgba(214,110,76,.45)}
.rb.on span{color:var(--acc)}
.rb.on i{color:var(--acc);opacity:.7}
.rb:active{transform:scale(.97)}

/* ══ баннер разбора ══ */
.banner{position:relative;z-index:3;margin:-40px 16px 0;padding:14px 15px;border-radius:var(--r-card);
  background:linear-gradient(150deg,#FDEFE9,#F8DCD1);box-shadow:var(--shadow);display:flex;gap:11px;align-items:flex-start}
.banner .bi{color:#B0522F;flex:none;margin-top:1px}
.banner .bt{flex:1;min-width:0}
.banner b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.02em;color:#7E3B22}
.banner span{display:block;font-size:11.5px;color:#A9634A;margin-top:3px;line-height:1.4}
.banner .bx{color:#C09079;font-size:15px;line-height:1;padding:2px 0 0 4px;flex:none}
.banner .bgo{margin-top:9px;padding:7px 13px;border-radius:var(--r-pill);background:#fff;
  color:#B0522F;font-size:11.5px;font-weight:800}

/* ══ поиск ══ */
.search{display:flex;align-items:center;gap:9px;margin:13px 16px 0;padding:11px 14px;
  border-radius:var(--r-pill);background:var(--soft)}
.search svg{color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px}
.search input::placeholder{color:var(--ink-3)}
.search .sx{color:var(--ink-3);font-size:15px;line-height:1;flex:none}

/* ══ быстрый срок в форме ══ */
.quick{display:flex;gap:6px;margin-top:7px}
.quick button{flex:1;padding:9px 0;border-radius:var(--r-pill);background:var(--surface);
  border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.quick button.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* ══ салют при отметке ══ */
.conf{position:fixed;top:50%;left:50%;width:9px;height:14px;border-radius:2px;z-index:80;
  pointer-events:none;opacity:0;animation:pop 1100ms cubic-bezier(.15,.7,.4,1) forwards}
@keyframes pop{
  0%{opacity:1;transform:translate(-50%,-50%) rotate(0deg) scale(.4)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1)}
}
@media (prefers-reduced-motion:reduce){.conf{display:none}}

/* ══ баннер разбора ══ */
.banner{position:relative;z-index:3;margin:14px 16px 0;padding:14px 15px;border-radius:var(--r-card);
  background:linear-gradient(150deg,#FDEFE9,#F8DDD2);display:flex;gap:12px;align-items:center;
  width:calc(100% - 32px);text-align:left}
.banner .bi{color:#B0522F;flex:none}
.banner .bt{flex:1;min-width:0}
.banner b{display:block;font-size:14px;font-weight:800;letter-spacing:-.02em;color:#8A4028}
.banner span{display:block;font-size:11.5px;color:#A9634A;margin-top:2px}
.banner .go{color:#B0522F;font-size:19px;flex:none}

/* ══ поиск ══ */
.search{display:flex;align-items:center;gap:9px;margin:13px 16px 0;padding:11px 14px;
  border-radius:var(--r-pill);background:var(--soft);border:1.5px solid transparent}
.search:focus-within{border-color:var(--acc);background:var(--surface)}
.search svg{color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px}
.search .x{color:var(--ink-3);font-size:16px;flex:none}

/* ══ салют ══ */
.fw{position:fixed;left:50%;top:46%;width:0;height:0;z-index:80;pointer-events:none}
.fw i{position:absolute;width:9px;height:9px;border-radius:2px;opacity:0;
  animation:pop 1.15s cubic-bezier(.16,.7,.35,1) forwards}
@keyframes pop{
  0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(.5)}
  70%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}
}

/* ══ переключение недель ══ */
.wknav{display:flex;align-items:center;gap:9px;margin:15px 16px 0}
.wknav .arr{width:32px;height:32px;border-radius:50%;background:var(--soft);display:flex;
  align-items:center;justify-content:center;color:var(--ink-2);font-size:15px;line-height:1;flex:none;
  transition:.14s}
.wknav .arr:active{background:#ECEEF0;transform:scale(.93)}
.wknav .lbl{font-size:12.5px;color:var(--ink-2);font-weight:700;letter-spacing:-.01em}
.wknav .today{margin-left:auto;font-size:11px;color:var(--acc);font-weight:800;padding:5px 11px;
  border-radius:var(--r-pill);background:var(--acc-soft);flex:none}

/* ══ лента дней ══ */
.days{display:flex;gap:4px;margin:14px 16px 0}
.dd{flex:1;text-align:center;padding:7px 0 8px;border-radius:14px;background:var(--soft);transition:.14s}
.dd .w{font-size:8.5px;color:var(--ink-3)}
.dd .n{font-size:13.5px;font-weight:800;margin-top:1px}
.dd .dot{width:4.5px;height:4.5px;border-radius:50%;margin:4px auto 0;background:#D9DDE2}
.dd .dot.full{background:var(--acc)}
.dd.on{background:var(--ink);color:#fff}
.dd.on .w{color:rgba(255,255,255,.62)}
.dd.on .dot{background:var(--a1)}
.dd.today .n{color:var(--acc)}
.dd.on.today .n{color:#fff}

/* ══ секции и карточки ══ */
.sect{display:flex;align-items:baseline;margin:18px 17px 9px}
.sect h2{font-size:15.5px;font-weight:800;letter-spacing:-.02em;margin:0}
.sect .cnt{margin-left:7px;font-size:10.5px;color:var(--ink-3);font-weight:700}
.sect .lnk{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--acc)}
.grp{display:flex;align-items:center;gap:8px;margin:18px 17px 9px;font-size:14px;font-weight:800;letter-spacing:-.02em}
.grp .gd{width:9px;height:9px;border-radius:3px;flex:none}
.grp b{margin-left:auto;font-size:10.5px;color:var(--ink-3)}
.hint{font-size:11.5px;color:var(--ink-3);margin:-4px 17px 9px}

.c{display:flex;gap:10px;align-items:center;margin:0 17px 8px;padding:11px 12px;border-radius:18px;
  background:var(--soft);width:calc(100% - 34px);text-align:left;transition:transform .12s}
.c:active{transform:scale(.985)}
.c .ic{width:37px;height:37px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.c .bd{flex:1;min-width:0}
.c .ttl{font-size:13.5px;font-weight:800;letter-spacing:-.01em;display:block}
.c .m{font-size:9.5px;color:var(--ink-3);margin-top:1px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .tm{font-size:10.5px;font-weight:800;color:var(--ink-3);flex:none}
.c.done{opacity:.62}
.c.done .ttl{text-decoration:line-through}
.tag{display:inline-block;margin-top:5px;padding:2px 8px;border-radius:var(--r-pill);font-size:9.5px;font-weight:800}
.tag.wait{background:#F0EFEC;color:#8A8172}
.tag.late{background:#F9E3DC;color:#B0522F}
.tag.miss{background:#ECEDEF;color:#7E848C}

.empty{margin:0 17px 8px;padding:13px 14px;border:1px dashed #E4E7EA;border-radius:18px;
  color:var(--ink-3);font-size:12px;width:calc(100% - 34px);text-align:left}

.blank{margin:38px 26px;text-align:center}
.blank h3{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:12px 0 5px}
.blank p{font-size:12.5px;color:var(--ink-3);margin:0;line-height:1.5}
.blank .em{display:flex;justify-content:center;color:var(--ink-4)}

/* ══ блоки копилки ══ */
.blk{margin:14px 12px 0;padding:13px 0 7px;border-radius:24px;background:#F4F5F7}
.blk.tinted{background:color-mix(in srgb, var(--tc) 9%, #fff)}
.blk.faded{background:#FAFAFB}
.blk.faded .bh{color:#9BA1A9}
.blk.faded .c{background:#F6F7F8}
.blk.faded .ttl{color:#6E747E}
.blk .c{background:var(--surface);margin:0 11px 7px;width:calc(100% - 22px)}
.blk .empty{background:var(--surface);margin:0 11px 7px;width:calc(100% - 22px)}
.bh{display:flex;align-items:center;gap:8px;margin:0 15px 11px;font-size:13px;font-weight:800;
  letter-spacing:-.02em;color:#5B6270}
.bh b{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-weight:700}
.bh .gd{width:9px;height:9px;border-radius:3px;flex:none}
.bhint{margin:-6px 15px 10px;font-size:11px;color:var(--ink-3)}
.dupwarn{margin-top:9px;padding:10px 12px;border-radius:14px;background:#FCEFE9;
  font-size:11.5px;line-height:1.45;color:#8A4028;display:flex;gap:8px;align-items:flex-start}
.dupwarn b{font-weight:800}
.dupwarn i{font-style:normal;flex:none;color:#B0522F}
.dups{margin:10px 0 2px;padding:12px 14px;border-radius:16px;background:var(--soft)}
.dup{font-size:12px;line-height:1.4;margin-bottom:8px}
.dup:last-child{margin-bottom:0}
.dup b{display:block;font-weight:700}
.dup span{color:var(--ink-3);font-size:11px}
.morebtn{display:block;width:calc(100% - 22px);margin:1px 11px 6px;padding:11px;border-radius:15px;
  background:var(--surface);border:1.5px dashed #E2E5E9;font-size:12.5px;font-weight:800;color:var(--acc);
  text-align:center}
.morebtn:active{background:var(--acc-soft)}
.blk-late{background:#FCEFE9}
.blk-late .bh{color:#B0522F}
.blk-late .bhint{color:#B98268}

/* ══ чип фильтра по теме ══ */
.chipbar{display:flex;gap:7px;margin:14px 16px 0;flex-wrap:wrap}
.fchip{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:var(--r-pill);
  background:var(--acc-soft);border:1.5px solid var(--acc);color:var(--acc);font-size:12px;font-weight:800}
.fchip em{font-style:normal;opacity:.6;font-size:14px;line-height:1}

/* ══ переключатель группировки ══ */
.segwrap{margin:14px 16px 0}
.seg{display:flex;gap:3px;padding:3px;background:#F2F3F5;border-radius:var(--r-pill)}
.seg button{flex:1;padding:8px 0;border-radius:var(--r-pill);font-size:10.5px;font-weight:700;color:var(--ink-3)}
.seg button.on{background:var(--ink);color:#fff}

/* ══ итоги ══ */
.box{margin:13px 16px 0;padding:16px 15px 12px;border-radius:var(--r-card);background:var(--soft)}
.box .cap{font-size:12.5px;font-weight:800;letter-spacing:-.01em;margin-bottom:13px}
.bars{display:flex;align-items:stretch;gap:9px;height:132px}
.rbar{flex:1;display:flex;flex-direction:column;align-items:center}
.track{flex:1;width:11px;border-radius:99px;position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(135deg,#F2F4F6 0 3px,#FAFBFC 3px 6px)}
.fill{position:absolute;left:0;right:0;bottom:0;border-radius:99px;background:#EFB9A6}
.fill.b{background:var(--acc)}
.rlb{font-size:9.5px;color:var(--ink-3);margin-top:8px}
.rlb.b{color:var(--ink);font-weight:800}
.minis{display:flex;gap:8px;margin:13px 16px 0}
.mini{flex:1;padding:13px 13px;border-radius:19px;background:var(--soft)}
.mini .k{font-size:9.5px;color:var(--ink-3)}
.mini .n{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-top:3px}
.mini .b{height:5px;border-radius:5px;background:#E2E5E9;margin-top:8px;overflow:hidden}
.mini .b i{display:block;height:100%;border-radius:5px;background:var(--acc)}
.rk{margin-bottom:12px}
.rk:last-child{margin-bottom:2px}
.rkh{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--ink-2)}
.rkh b{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--ink)}
.rkb{height:6px;border-radius:6px;background:#E8EAEE;overflow:hidden}
.rkb i{display:block;height:100%;border-radius:6px;min-width:6px}
.legend{margin:13px 16px 0;padding:15px;border-radius:var(--r-card);background:var(--soft);display:flex;gap:14px;align-items:center}
.legend ul{list-style:none;flex:1;margin:0;padding:0}
.legend li{display:flex;align-items:center;gap:7px;font-size:11.5px;margin-bottom:5px;color:var(--ink-2)}
.legend li:last-child{margin-bottom:0}
.legend li b{margin-left:auto;color:var(--ink)}
.legend .sw{width:8px;height:8px;border-radius:3px;flex:none}

/* ══ «ещё» ══ */
.rowlist{margin:14px 16px 0;background:var(--soft);border-radius:var(--r-card);overflow:hidden}
.rowlist.lift{position:relative;z-index:3;margin-top:-40px;background:var(--surface);box-shadow:var(--shadow)}
.rowlist .rwh{display:flex;align-items:baseline;padding:14px 15px 10px;font-size:15px;font-weight:800;letter-spacing:-.02em}
.rowlist .rwh span{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-weight:700}
.rw{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:13px;width:100%;text-align:left}
.rw+.rw{border-top:1px solid #EDEEF0}
.rw b{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.about{margin:16px 20px 0;font-size:11.5px;color:var(--ink-3);line-height:1.55}

/* ══ нижняя панель ══ */
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(74px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:flex-start;
  padding:9px 8px 0;z-index:40}
.nav .t{flex:1;text-align:center;font-size:8.5px;color:var(--ink-3);display:flex;flex-direction:column;
  align-items:center;gap:2px}
.nav .t.on{color:var(--ink);font-weight:800}
.nav .gap{width:84px;flex:none}
.plus{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);
  width:82px;height:82px;border-radius:50%;
  background:radial-gradient(circle at 34% 22%, rgba(255,255,255,.58) 0%, rgba(255,255,255,0) 48%),
             linear-gradient(160deg, var(--a1) 0%, var(--a2) 64%, #DE4520 100%);
  box-shadow:0 2px 3px rgba(255,255,255,.8) inset, 0 -7px 16px rgba(0,0,0,.24) inset,
    0 16px 30px -5px rgba(242,84,45,.62), 0 30px 52px -14px rgba(20,16,14,.45), 0 0 0 7px #fff;
  display:flex;align-items:center;justify-content:center;z-index:45;transition:transform .12s}
.plus span{font-size:56px;line-height:1;font-weight:200;color:#fff;margin-top:-6px;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.plus:active{transform:translateX(-50%) translateY(3px) scale(.97)}

/* ══ шторка ══ */
.scrim{position:fixed;inset:0;background:rgba(22,19,15,.44);opacity:0;pointer-events:none;transition:.22s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--surface);border-radius:28px 28px 0 0;transform:translateY(102%);
  transition:transform .26s cubic-bezier(.2,.8,.3,1);z-index:60;
  padding:0 18px calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 4px}
.sh{font-size:23px;font-weight:800;letter-spacing:-.03em;margin:10px 0 18px}
.fld{margin-bottom:15px}
.fld>label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:7px;letter-spacing:.02em}
.fld input,.fld textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:15px;
  background:var(--surface);outline:none}
.fld input:focus,.fld textarea:focus{border-color:var(--acc)}
.fld textarea{resize:none;min-height:60px}
.two{display:flex;gap:9px}
.two>div{flex:1;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:9px 12px;border-radius:var(--r-pill);background:var(--surface);border:1.5px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.opt.on{background:var(--acc);border-color:var(--acc);color:#fff}
.more{font-size:12.5px;color:var(--acc);font-weight:800;padding:4px 0 14px}
.hidden{display:none}
.save{width:100%;height:52px;border-radius:var(--r-pill);font-size:15.5px;font-weight:800;color:#fff;
  background:linear-gradient(160deg,var(--a1),var(--a2));box-shadow:0 10px 22px -6px rgba(242,84,45,.55);margin-top:4px}
.save[disabled]{opacity:.32;box-shadow:none}
.dtop{display:flex;gap:12px;align-items:flex-start;margin:6px 0 16px}
.dtop .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.dtop h3{font-size:21px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.18}
.dtop .sub{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.rows{background:var(--soft);border-radius:var(--r-card);overflow:hidden;margin-bottom:16px}
.row{display:flex;gap:12px;padding:11px 15px;font-size:13.5px}
.row+.row{border-top:1px solid #EDEEF0}
.row .k{color:var(--ink-3);width:92px;flex:none;font-size:12px}
.row .v{flex:1;min-width:0;word-break:break-word}
.row a{color:var(--acc);text-decoration:none}
.acts{display:flex;flex-direction:column;gap:8px}
.act{height:48px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);
  font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.act.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.act.quiet{color:var(--ink-3);border-style:dashed;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r-pill);font-size:13px;
  opacity:0;pointer-events:none;transition:.22s;z-index:70;max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ══ аварийная защита: если где-то ниже случится ошибка, ══
   экран не останется пустым — покажет текст ошибки на месте. ══ */
function escSafe(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function showFatalError(err){
  try {
    var msg = (err && err.message) ? err.message : String(err);
    var app = document.getElementById("app");
    if (app) app.innerHTML =
      '<div style="padding:56px 20px 20px;text-align:center;font-family:inherit">' +
      '<div style="font-size:32px">warn</div>'.replace("warn","⚠️") +
      '<h3 style="font-size:17px;font-weight:800;margin:14px 0 8px">Экран не построился</h3>' +
      '<p style="font-size:12px;color:#8A8F98;line-height:1.5;margin:0 0 14px">Пришли этот текст в чат — я быстро починю:</p>' +
      '<div style="text-align:left;background:#F7F8F9;border-radius:14px;padding:12px 14px;font-size:11px;' +
        'color:#B0522F;line-height:1.5;word-break:break-word">' + escSafe(msg) + '</div>' +
      '<button onclick="location.reload()" style="margin-top:16px;padding:12px 22px;border-radius:99px;' +
        'background:#16130F;color:#fff;font-weight:700;font-size:13.5px;border:0">Перезагрузить</button></div>';
    var nav = document.getElementById("nav");
    if (nav){ nav.hidden = false; nav.innerHTML = '<button class="t on" onclick="location.reload()">Обновить</button>'; }
  } catch(e2){}
}
window.onerror = function(msg,url,line,col,err){
  showFatalError(err || {message: msg + " (строка " + line + ")"});
  return true;
};

var KEY = "taymaut.items.v3", mem = null;
var DKEY = "taymaut.deleted.v1", dmem = null;

/* название → ключ для сверки: регистр, кавычки и пробелы не в счёт */
function normKey(s){
  return String(s||"").toLowerCase()
    .replace(/ё/g,"е")
    .replace(/[^a-zа-я0-9]+/g,"");
}
var Store = {
  get:function(cb){
    /* Telegram может не ответить вовсе — ждём не дольше полутора секунд,
       иначе берём локальную копию. Callback срабатывает строго один раз. */
    var fired = false, timer = null;
    function finish(v){
      if (fired) return;
      fired = true;
      if (timer) { try{ clearTimeout(timer); }catch(e){} }
      cb(v);
    }
    timer = setTimeout(function(){ finish(Store.local()); }, 1500);
    try{
      if (TG && TG.CloudStorage && TG.CloudStorage.getItem){
        TG.CloudStorage.getItem(KEY,function(err,val){
          if (err||!val){ finish(Store.local()); return; }
          try{ finish(JSON.parse(val)); }catch(e){ finish(Store.local()); }
        });
        return;
      }
    }catch(e){}
    finish(Store.local());
  },
  set:function(list){
    var s = JSON.stringify(list); mem = list;
    if (TG && TG.CloudStorage && TG.CloudStorage.setItem){ try{ TG.CloudStorage.setItem(KEY,s,function(){}); }catch(e){} }
    try{ window.localStorage.setItem(KEY,s); }catch(e){}
  },
  local:function(){
    try{ var v = window.localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}
    return mem;
  }
};

/* ── что пользователь удалил: чтобы загрузка списка это не воскрешала ── */
var Trash = {
  get:function(cb){
    var fired = false, timer = null;
    function finish(v){
      if (fired) return;
      fired = true;
      if (timer) { try{ clearTimeout(timer); }catch(e){} }
      cb(v);
    }
    timer = setTimeout(function(){ finish(Trash.local()); }, 1500);
    try{
      if (TG && TG.CloudStorage && TG.CloudStorage.getItem){
        TG.CloudStorage.getItem(DKEY,function(err,val){
          if (err||!val){ finish(Trash.local()); return; }
          try{ finish(JSON.parse(val)); }catch(e){ finish(Trash.local()); }
        });
        return;
      }
    }catch(e){}
    finish(Trash.local());
  },
  set:function(list){
    var s = JSON.stringify(list); dmem = list;
    if (TG && TG.CloudStorage && TG.CloudStorage.setItem){ try{ TG.CloudStorage.setItem(DKEY,s,function(){}); }catch(e){} }
    try{ window.localStorage.setItem(DKEY,s); }catch(e){}
  },

    try{ var v = window.localStorage.getItem(DKEY); if(v) return JSON.parse(v); }catch(e){}

  }
};

function pad(n){ n = String(n); return n.length<2 ? "0"+n : n; }
function toISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fromISO(s){ var p = String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayISO(){ return toISO(new Date()); }
function shift(iso,n){ var d = fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function mondayOf(iso){ var d = fromISO(iso), wd = d.getDay(); d.setDate(d.getDate()-(wd===0?6:wd-1)); return toISO(d); }
function human(iso){ var d = fromISO(iso); return d.getDate()+" "+MON[d.getMonth()]; }
function plural(n,a,b,c){ var x = Math.abs(n)%100, y = x%10;
  if (x>10&&x<20) return c; if (y>1&&y<5) return b; if (y===1) return a; return c; }

function durLabel(id){ var d = CFG.durations.filter(function(x){return x.id===id;})[0]; return d?d.label:""; }

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function tint(hex,a){ var h = hex.replace("#",""),
  r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return "rgba("+r+","+g+","+b+","+a+")"; }

function boot(){

  function start(cfg, off){
    if (done) return; done = true;
    CFG = cfg; offline = off;
    if (cfg.app && cfg.app.hero) HERO_IMG = cfg.app.hero;
    Trash.get(function(d){ deleted = d || []; });
    Store.get(function(saved){
      try{
        items = (saved && saved.length) ? saved.map(migrate) : (cfg.items||[]).map(seed);
        if (!saved || !saved.length) Store.set(items);
        document.getElementById("nav").hidden = false;
        document.getElementById("plusBtn").hidden = false;
        render();
      }catch(err){ showFatalError(err); }
    });
  }
  try{
    fetch("data.json?v="+Date.now(),{cache:"no-store"})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){ if(!j||!j.themes||!j.themes.length) throw 0; start(j,false); })
      .catch(function(){ start(FALLBACK,true); });
  }catch(e){ start(FALLBACK,true); }
  setTimeout(function(){ start(FALLBACK,true); }, 4000);
}
function startSafe(){
  try{ boot(); }catch(err){ showFatalError(err); }
  /* страховка от «вечного ожидания»: что бы ни случилось,
     через 6 секунд экран будет построен на встроенных данных */
  setTimeout(function(){
    try{
      var app = document.getElementById("app");
      if (app && app.innerHTML.length > 200) return;      /* уже нарисовано */
      if (!CFG) CFG = FALLBACK;
      if (!items || !items.length) items = (CFG.items||[]).map(seed);
      document.getElementById("nav").hidden = false;
      document.getElementById("plusBtn").hidden = false;
      render();
    }catch(err){ showFatalError(err); }
  }, 6000);
}
function seed(raw){
  var it = {}, k, t = todayISO();
  for (k in raw) if (raw.hasOwnProperty(k)) it[k] = raw[k];
  if (typeof raw.dateOffset === "number") it.date = shift(t, raw.dateOffset);
  else if (!raw.date) it.date = null;
  delete it.dateOffset;
  if (typeof raw.until === "string" && raw.until.charAt(0) === "+") it.until = shift(t, parseInt(raw.until,10));
  it.createdAt = it.createdAt || new Date().toISOString();
  return migrate(it);
}
function migrate(it){
  if (!it.where) it.where = (it.format === "home") ? "home" : "moscow";
  if (it.spot === undefined) it.spot = it.place || "";
  if (typeof it.place === "string") delete it.place;
  return it;
}

/* ═══════════ СТАТУСЫ ═══════════ */
function state(it){
  if (it.status==="done") return "done";
  if (it.status==="cancelled") return "cancelled";
  var t = todayISO();
  if (it.date && it.date < t) return "missed";
  if (it.until && it.until < t) return "expired";
  return "planned";
}
function isLive(it){ var s = state(it); return s!=="done" && s!=="cancelled"; }
function passPlace(it){ return place==="all" || it.where===place; }
function countPlace(id){
  return items.filter(function(it){ return isLive(it) && (id==="all" || it.where===id); }).length;
}
function passTheme(it){ return !themeFilter || it.theme===themeFilter; }
function passQuery(it){
  if (!query) return true;
  var q = query.toLowerCase();
  return (it.title||"").toLowerCase().indexOf(q) >= 0
      || (it.spot ||"").toLowerCase().indexOf(q) >= 0
      || (it.note ||"").toLowerCase().indexOf(q) >= 0;
}
function inboxItems(){
  var wEnd = shift(weekStart,6);
  return items.filter(function(it){
    if (!isLive(it) || !passPlace(it) || !passTheme(it) || !passQuery(it)) return false;
    if (!it.date) return true;
    if (state(it) === "missed") return true;      /* прошло без отметки — тоже в разбор */
    return it.date > wEnd;
  });
}
function weekStats(){
  var wEnd = shift(weekStart,6), planned = 0, done = 0;
  items.forEach(function(it){
    if (!it.date || it.date < weekStart || it.date > wEnd) return;
    if (!passPlace(it)) return;
    if (it.status === "cancelled") return;
    planned++;
    if (it.status === "done") done++;
  });
  return {planned:planned, done:done};
}
function needsSorting(){
  return items.filter(function(it){
    var s = state(it);
    return s === "missed" || s === "expired";
  });
}
function busyDays(){
  var set = {}, i, iso;
  for (i=0;i<7;i++){
    iso = shift(weekStart,i);
    if (items.some(function(it){ return it.date===iso && isLive(it) && passPlace(it); })) set[iso]=1;
  }
  return set;
}
</script>
<script>
"use strict";

/* ═══════════ ОТРИСОВКА ═══════════ */
function render(){
  try {
    var h = offline ? '<div class="strip">Работаю на встроенных примерах — data.json не загрузился</div>' : "";
    if (view==="week")       h += viewWeek();
    else if (view==="inbox") h += viewInbox();
    else if (view==="stats") h += viewStats();
    else                     h += viewMore();
    document.getElementById("app").innerHTML = h;
    document.getElementById("nav").innerHTML = navBar();
  } catch(err) { showFatalError(err); }
}

function hero(title){
  var s = HERO_IMG
    ? 'background-image:linear-gradient(180deg,rgba(8,10,14,.5),rgba(8,10,14,.03) 50%,rgba(255,255,255,.96)),url('+HERO_IMG+')'
    : 'background-image:linear-gradient(155deg,#5B6E7C,#93867A 42%,#D9A67E 78%,#F0C79A)';
  return '<div class="hero" style="'+s+'"><div class="hd">' +
         '<div class="brand">'+esc(CFG.app&&CFG.app.name?CFG.app.name:"Таймаут")+'</div>' +
         '<h1>'+title+'</h1></div></div>';
}

function placeTiles(){
  var list = [{id:"all",label:"Все",ic:"all"}];
  CFG.places.forEach(function(p){ list.push({id:p.id,label:p.label,ic:PLACE_ICON[p.id]||"other"}); });
  return '<div class="rbot">' + list.map(function(p){
    return '<button class="rb'+(place===p.id?" on":"")+'" onclick="setPlace(\''+p.id+'\')">' +
           icon(p.ic,26,1.9)+'<span>'+esc(p.label)+'</span><i>'+countPlace(p.id)+'</i></button>';
  }).join("") + '</div>';
}

/* ═══════════ НЕДЕЛЯ ═══════════ */
function viewWeek(){
  var busy = busyDays(), free = [], i, iso, d;
  for (i=0;i<7;i++){ iso = shift(weekStart,i); if (!busy[iso]) free.push(WD2[fromISO(iso).getDay()]); }
  var w = weekStats();
  var dash = 163.4, off = w.planned ? dash - dash*(w.done/w.planned) : dash;
  var full = w.planned > 0 && w.done === w.planned;
  var big, sm;
  if (!w.planned){ big = "Неделя пока пустая"; sm = "Поставь идею из копилки на любой день"; }
  else { big = "Сделано " + w.done + " из " + w.planned;
         sm = full ? "Неделя закрыта — всё состоялось"
                   : (free.length ? "Свободны " + free.join(", ") : "Свободных дней нет"); }

  var h = hero("Привет,<br>Наденька");

  var bn = banner();
  h += bn;
  h += '<div class="ring"' + (bn ? ' style="margin-top:14px"' : '') + '><div class="rtop">' +
    '<svg width="52" height="52" viewBox="0 0 62 62">' +
    '<circle cx="31" cy="31" r="26" fill="none" stroke="#ECEDF0" stroke-width="8"/>' +
    '<circle cx="31" cy="31" r="26" fill="none" stroke="'+(full?"#2F9E6B":"#D66E4C")+'" stroke-width="8" stroke-linecap="round" ' +
    'stroke-dasharray="'+dash.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 31 31)"/>' +
    '<text x="31" y="37" text-anchor="middle" font-size="18" font-weight="800" fill="#16130F">'+w.done+'</text></svg>' +
    '<div class="txt"><div class="k">Эта неделя</div>' +
    '<div class="big">'+big+'</div><div class="sm">'+sm+'</div></div>' +
    '</div>' + placeTiles() + '</div>';

  h += '<div class="wknav">' +
    '<button class="arr" onclick="weekNav(-7)" aria-label="Предыдущая неделя">&lsaquo;</button>' +
    '<span class="lbl">' + human(weekStart) + ' — ' + human(shift(weekStart,6)) + '</span>' +
    '<button class="arr" onclick="weekNav(7)" aria-label="Следующая неделя">&rsaquo;</button>' +
    (weekStart !== mondayOf(todayISO()) ? '<button class="today" onclick="weekNav(0)">Сегодня</button>' : '') +
    '</div>';

  h += '<div class="days">';
  for (i=0;i<7;i++){
    iso = shift(weekStart,i); d = fromISO(iso);
    h += '<button class="dd'+(selDay===iso&&!weekAll?" on":"")+(iso===todayISO()?" today":"")+'" onclick="pickDay(\''+iso+'\')">' +
         '<div class="w">'+WD2[d.getDay()]+'</div><div class="n">'+d.getDate()+'</div>' +
         '<div class="dot'+(busy[iso]?" full":"")+'"></div></button>';
  }
  h += '</div>';

  if (weekAll){
    h += '<div class="sect"><h2>Вся неделя</h2><button class="lnk" onclick="setWeekAll(false)">по дням →</button></div>';
    var anyFilled = false;
    for (i=0;i<7;i++){
      iso = shift(weekStart,i); d = fromISO(iso);
      var list = dayItems(iso);
      if (!list.length) continue;              /* пустые дни в этом виде не показываем */
      anyFilled = true;
      h += '<div class="grp">'+d.getDate()+' '+WD2[d.getDay()]+'<b>'+list.length+'</b></div>';
      h += list.map(card).join("");
    }
    if (!anyFilled){
      h += '<div class="blank"><div class="em">'+icon("jar",34,1.5)+'</div><h3>На этой неделе пока пусто</h3>' +
           '<p>Поставь идею из копилки на любой день —<br>переключись «по дням», чтобы выбрать.</p></div>';
    }
  } else {
    var list2 = dayItems(selDay);
    var sd = fromISO(selDay);
    var lbl = (selDay===todayISO()) ? "Сегодня" : (sd.getDate()+" "+MON[sd.getMonth()]);
    h += '<div class="sect"><h2>'+lbl+'</h2><span class="cnt">'+WD[sd.getDay()]+'</span>' +
         '<button class="lnk" onclick="setWeekAll(true)">вся неделя →</button></div>';
    h += list2.length ? list2.map(card).join("") : emptyDay(selDay);
  }
  return h;
}
function dayItems(iso){
  return items.filter(function(it){ return it.date===iso && passPlace(it); })
              .sort(function(a,b){ return (a.time||"99:99").localeCompare(b.time||"99:99"); });
}
function emptyDay(iso){
  return '<button class="empty" onclick="openAdd(\''+iso+'\')">Свободно — поставить сюда идею</button>';
}

function banner(){
  if (bannerOff) return "";
  var wd = new Date().getDay(), weekend = (wd===5||wd===6||wd===0);
  var miss = items.filter(function(it){ return state(it)==="missed"; }).length;
  var exp  = items.filter(function(it){ return state(it)==="expired"; }).length;
  var free = items.filter(function(it){ return isLive(it) && !it.date; }).length;
  if (!weekend && !miss && !exp) return "";
  if (!free && !miss && !exp) return "";

  var parts = [];
  if (exp)  parts.push(exp+" "+plural(exp,"просрочена","просрочены","просрочено"));
  if (miss) parts.push(miss+" "+plural(miss,"прошло","прошли","прошли")+" без отметки");
  if (free) parts.push(free+" "+plural(free,"идея ждёт","идеи ждут","идей ждут")+" дня");

  return '<div class="banner"><span class="bi">'+icon("hourglass",19,1.8)+'</span>' +
    '<span class="bt"><b>Пора разобрать копилку</b><span>'+esc(parts.join(" · "))+'</span>' +
    '<button class="bgo" onclick="goSort()">Разобрать →</button></span>' +
    '<button class="bx" onclick="hideBanner()">✕</button></div>';
}

/* ═══════════ КОПИЛКА ═══════════ */
function viewInbox(){
  var h = hero("Копилка");
  h += '<div class="ring" style="padding:12px 13px">' +
       placeTiles().replace('class="rbot"','class="rbot" style="margin-top:0;padding-top:0;border-top:0"') +
       '</div>';
  h += '<div class="search">' + icon("search",17,1.9) +
    '<input type="text" placeholder="Найти идею" value="'+esc(query)+'" oninput="setQuery(this.value)">' +
    (query ? '<button class="sx" onclick="setQuery(\'\')">✕</button>' : '') + '</div>';
  h += '<div class="segwrap"><div class="seg">' +
    segBtn("urgency","По срочности") + segBtn("theme","По темам") + segBtn("where","По месту") +
    '</div></div>';

  if (themeFilter){
    h += '<div class="chipbar"><button class="fchip" onclick="clearTheme()">' +
         esc(theme(themeFilter).label)+' <em>✕</em></button></div>';
  }

  var list = inboxItems();
  var archive = items.filter(function(it){ return !isLive(it) && passPlace(it) && passTheme(it); });

  if (!list.length && !archive.length){
    return h + '<div class="blank"><div class="em">'+icon("jar",34,1.5)+'</div><h3>Тут пока пусто</h3>' +
           '<p>'+(themeFilter ? "В этой теме нет идей. Сними фильтр, чтобы увидеть остальные."
                              : "Увидела что-то интересное — добавь сюда, чтобы не потерять.")+'</p></div>';
  }

  if (groupBy==="theme")      h += groupsByTheme(list);
  else if (groupBy==="where") h += groupsByWhere(list);
  else                        h += groupsByUrgency(list);

  if (archive.length){
    h += '<div class="blk"><div class="bh">Архив<b>'+archive.length+'</b>' +
         '<button class="lnk" style="margin-left:10px" onclick="togArch()">'+(showArchive?"свернуть":"показать")+'</button></div>' +
         (showArchive ? archive.map(card).join("") : "") + '</div>';
  }
  return h;
}
function segBtn(id,label){
  return '<button class="'+(groupBy===id?"on":"")+'" onclick="setGroup(\''+id+'\')">'+label+'</button>';
}

/* блок-контейнер группы */
function block(title, list, hint, opts){
  if (!list.length) return "";
  opts = opts || {};
  var head = "";
  if (opts.dot)  head += '<span class="gd" style="background:'+opts.dot+'"></span>';
  if (opts.icon) head += icon(opts.icon,17,1.8);
  head += esc(title)+'<b>'+list.length+'</b>';
  var cls = opts.late ? " blk-late" : (opts.faded ? " faded" : (opts.dot ? " tinted" : ""));
  var st  = opts.dot ? ' style="--tc:'+opts.dot+'"' : "";

  var key = opts.key || "g";
  var lim = opened[key] ? list.length : Math.min(list.length, PAGE);
  var rest = list.length - lim;
  var body = list.slice(0, lim).map(card).join("");
  if (rest > 0)
    body += '<button class="morebtn" onclick="expand(\''+key+'\')">Ещё ' + rest + ' ' +
            plural(rest,"карточка","карточки","карточек") + '</button>';

  return '<div class="blk'+cls+'"'+st+'><div class="bh">'+head+'</div>' +
         (hint?'<div class="bhint">'+esc(hint)+'</div>':"") + body + '</div>';
}

function groupsByUrgency(list){
  var wEnd = shift(weekStart,6);
  var missed = list.filter(function(it){ return state(it)==="missed"; })
                   .sort(function(a,b){ return b.date.localeCompare(a.date); });
  var expired = list.filter(function(it){ return state(it)==="expired"; });
  var soon = list.filter(function(it){ return state(it)!=="expired" && it.until; })
                 .sort(function(a,b){ return a.until.localeCompare(b.until); });
  var waiting = list.filter(function(it){ return it.date && it.date>wEnd && state(it)!=="missed"; })
                    .sort(function(a,b){ return a.date.localeCompare(b.date); });
  var free = list.filter(function(it){ return !it.date && !it.until && state(it)!=="missed"; });
  return block("Прошло без отметки",missed,"Дата была, а отметки нет. Сделала — отметь, нет — перенеси.",{icon:"hourglass",late:true,key:"missed"}) +
         block("Просрочено",expired,"Срок вышел — отметь или отмени.",{icon:"hourglass",late:true,key:"expired"}) +
         block("Скоро закроется",soon,"Поставь день, пока не поздно.",{icon:"hourglass",late:true,key:"soon"}) +
         block("Разобрать",free,"Без даты. Открой карточку и назначь день.",{icon:"stack",key:"free"}) +
         block("Ждут даты",waiting,"День назначен — появятся в неделе сами.",{icon:"calendar",faded:true,key:"waiting"});
}
function groupsByTheme(list){
  var out = "";
  CFG.themes.forEach(function(t){
    out += block(t.label, list.filter(function(it){ return it.theme===t.id; }), "", {dot:t.color,key:t.id});
  });
  return out;
}
function groupsByWhere(list){
  var out = "";
  CFG.places.forEach(function(p){
    out += block(p.label, list.filter(function(it){ return it.where===p.id; }), "",
                 {icon:PLACE_ICON[p.id]||"other", key:"w-"+p.id});
  });
  return out;
}

/* ═══════════ КАРТОЧКА В СПИСКЕ ═══════════ */
function card(it){
  var th = theme(it.theme), st = state(it), meta = [];
  if (it.spot) meta.push(it.spot);
  meta.push(durLabel(it.duration).toLowerCase());
  if (it.where!=="moscow") meta.push(placeLabel(it.where).toLowerCase());

  var tag = "";
  if (st==="expired") tag = '<span class="tag late">до '+human(it.until)+' — вышло</span>';
  else if (st==="missed") tag = '<span class="tag miss">прошло без отметки</span>';
  else if (it.until) tag = '<span class="tag wait">до '+human(it.until)+'</span>';
  else if (it.date && view==="inbox") tag = '<span class="tag wait">'+human(it.date)+'</span>';

  return '<button class="c'+(st==="done"||st==="cancelled"?" done":"")+'" onclick="openCard(\''+it.id+'\')">' +
    '<span class="ic" style="color:'+th.color+';background:'+tint(th.color,.1)+'">'+icon(it.theme,21,1.7)+'</span>' +
    '<span class="bd"><span class="ttl">'+esc(it.title)+'</span>' +
    '<span class="m">'+esc(meta.join(" · "))+'</span>'+tag+'</span>' +
    (it.time && view==="week" ? '<span class="tm">'+esc(it.time)+'</span>' : '') + '</button>';
}

function navBar(){
  function t(id,ico,label){
    return '<button class="t'+(view===id?" on":"")+'" onclick="setView(\''+id+'\')">'+icon(ico,17,1.8)+label+'</button>';
  }
  return t("week","calendar","Неделя") + t("inbox","jar","Копилка") +
         '<div class="gap"></div>' + t("stats","chart","Итоги") + t("more","dots","Ещё");
}
</script>
<script>
"use strict";

/* ═══════════ ИТОГИ ═══════════ */
function viewStats(){
  var now = new Date(), ym = now.getFullYear()+"-"+pad(now.getMonth()+1);
  var inMonth = items.filter(function(it){ return it.date && it.date.indexOf(ym)===0; });
  var doneMonth = inMonth.filter(function(it){ return it.status==="done"; });
  var doneAll = items.filter(function(it){ return it.status==="done"; });

  var h = hero("Итоги");

  h += '<div class="ring"><div class="rtop"><span class="sic">'+icon("chart",24,1.8)+'</span>' +
       '<div class="txt"><div class="k">'+MONN[now.getMonth()].charAt(0).toUpperCase()+MONN[now.getMonth()].slice(1)+'</div>' +
       '<div class="big">Сделано '+doneMonth.length+' из '+inMonth.length+'</div>' +
       '<div class="sm">'+(doneAll.length ? "Всего вышло погулять: "+doneAll.length : "Отметь первое дело как сделанное")+'</div></div>' +
       '</div></div>';

  if (!doneAll.length){
    return h + '<div class="blank"><div class="em">'+icon("chart",34,1.5)+'</div>' +
      '<h3>Данных пока нет</h3><p>Графики появятся, когда наберутся отметки «сделано».<br>Это займёт месяц-другой.</p></div>';
  }

  /* ── когда ходишь ── */
  var byWd = [0,0,0,0,0,0,0];
  doneAll.forEach(function(it){ if (it.date) byWd[fromISO(it.date).getDay()]++; });
  var maxWd = Math.max.apply(null, byWd) || 1;
  var bestWd = -1;
  [1,2,3,4,5,6,0].forEach(function(d){ if (maxWd > 0 && byWd[d] === maxWd && bestWd < 0) bestWd = d; });
  h += '<div class="box"><div class="cap">Когда ходишь</div><div class="bars">';
  [1,2,3,4,5,6,0].forEach(function(d){
    var v = byWd[d], pc = v ? Math.max(Math.round(v/maxWd*100), 4) : 0, b = (d === bestWd) ? " b" : "";
    h += '<div class="rbar"><div class="track">' +
         (v ? '<div class="fill'+b+'" style="height:'+pc+'%"></div>' : '') +
         '</div><div class="rlb'+b+'">'+WD2[d]+'</div></div>';
  });
  h += '</div></div>';

  /* ── куда ходишь: рейтинг по темам ── */
  var tot = doneAll.length;
  var rows = [];
  CFG.themes.forEach(function(t){
    var v = doneAll.filter(function(it){ return it.theme===t.id; }).length;
    if (v) rows.push({t:t, v:v});
  });
  rows.sort(function(a,b){ return b.v-a.v; });
  var top = rows[0] ? rows[0].v : 1;

  h += '<div class="box"><div class="cap">Куда ходишь</div>';
  rows.forEach(function(r){
    h += '<div class="rk"><div class="rkh"><span style="color:'+r.t.color+'">'+icon(r.t.id,16,1.8)+'</span>' +
         esc(r.t.label)+'<b>'+r.v+'</b></div>' +
         '<div class="rkb"><i style="width:'+Math.round(r.v/top*100)+'%;background:'+r.t.color+'"></i></div></div>';
  });
  h += '</div>';

  /* ── где бываешь ── */
  h += '<div class="box"><div class="cap">Где бываешь</div><div class="minis" style="margin:0">';
  CFG.places.forEach(function(p){
    var v = doneAll.filter(function(it){ return it.where===p.id; }).length;
    h += '<div class="mini" style="background:var(--surface)"><div class="k">'+esc(p.label)+'</div><div class="n">'+v+'</div>' +
         '<div class="b"><i style="width:'+Math.round(v/tot*100)+'%"></i></div></div>';
  });
  h += '</div></div>';

  return h;
}

/* ═══════════ ЕЩЁ ═══════════ */
function viewMore(){
  var h = hero("Ещё");
  h += '<div class="rowlist lift"><div class="rwh">Темы<span>нажми, чтобы открыть</span></div>';
  CFG.themes.forEach(function(t){
    var v = items.filter(function(it){ return it.theme===t.id && isLive(it); }).length;
    h += '<button class="rw" onclick="openTheme(\''+t.id+'\')"><span style="color:'+t.color+'">' +
         icon(t.id,19,1.8)+'</span>'+esc(t.label)+'<b>'+(v?v:"пусто")+'</b></button>';
  });
  h += '</div>';
  h += '<div class="rowlist">' +
       '<button class="rw" onclick="openImport()">' + icon("stack",19,1.8) + 'Загрузить список из файла<b>' +
         (CFG.items ? CFG.items.length : 0) + '</b></button>' +
       '<button class="rw" onclick="resetAll()">' + icon("hourglass",19,1.8) + 'Стереть всё и начать заново<b>сброс</b></button>' +
       '</div>';
  h += '<div class="rowlist"><div class="rw">Версия сборки<b>' + BUILD + '</b></div>' +
       '<div class="rw">Карточек сейчас<b>' + items.length + '</b></div>' +
       '<div class="rw">Защита от дублей<b>' + (typeof findTwin === "function" ? "включена" : "НЕТ") + '</b></div></div>';
  h += '<div class="about">Данные хранятся в твоём Telegram (CloudStorage) и в памяти браузера. ' +
       'Фотография на шапке меняется в data.json — поле app.hero. ' +
       (offline ? 'Сейчас приложение работает на встроенных примерах: data.json не загрузился.' : 'Файл data.json загружен.') +
       '</div>';
  return h;
}
function openTheme(id){
  themeFilter = id; groupBy = "urgency"; place = "all"; view = "inbox";
  haptic(); window.scrollTo(0,0); render();
}
function clearTheme(){ themeFilter = null; haptic(); render(); }
function resetAll(){
  if (!window.confirm("Стереть все записи и загрузить список заново? Отметки и правки пропадут.")) return;
  items = (CFG.items||[]).map(seed);
  deleted = []; Trash.set(deleted);
  Store.set(items); opened = {}; toast("Список загружен заново"); render();
}

/* ═══════════ ДЕЙСТВИЯ ═══════════ */
function setView(v){ view = v; weekAll = false; if (v!=="inbox"){ themeFilter = null; query = ""; } haptic(); window.scrollTo(0,0); render(); }
function setPlace(p){ opened = {}; place = p; haptic(); render(); }
function setGroup(g){ opened = {}; groupBy = g; haptic(); render(); }
function pickDay(iso){ selDay = iso; weekAll = false; haptic(); render(); }
function setWeekAll(v){ weekAll = v; render(); }
function weekNav(n){
  var off = 0, i;
  for (i=0;i<7;i++) if (shift(weekStart,i) === selDay) off = i;   /* тот же день недели */
  if (n) { weekStart = shift(weekStart, n); selDay = shift(weekStart, off); }
  else   { weekStart = mondayOf(todayISO()); selDay = todayISO(); }
  haptic(); render();
}
function togArch(){ showArchive = !showArchive; render(); }
function expand(k){ opened[k] = true; haptic(); render(); }
function setQuery(v){ query = v; render(); }
function hideBanner(){ bannerOff = true; haptic(); render(); }
function goSort(){ view = "inbox"; groupBy = "urgency"; themeFilter = null; place = "all";
  haptic(); window.scrollTo(0,0); render(); }

/* ═══════════ ШТОРКА ═══════════ */
function openSheet(html){
  document.getElementById("sheetBody").innerHTML = html;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("scrim").classList.add("on");
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
  draft = null;
}
document.getElementById("scrim").addEventListener("click", closeSheet);
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove("on"); }, 1900);
}

/* ═══════════ ДОБАВЛЕНИЕ И РЕДАКТИРОВАНИЕ ═══════════ */
document.getElementById("plusBtn").addEventListener("click", function(){ openAdd(null); });

function openAdd(dateISO){
  haptic("medium");
  draft = { editId:null, title:"", theme:"", where:"moscow", duration:"evening",
            date:dateISO||"", time:"", spot:"", until:"", link:"", note:"" };
  drawForm();
}
function openEdit(id){
  var it = items.filter(function(x){ return x.id===id; })[0];
  if (!it) return;
  haptic("medium");
  draft = { editId:it.id, title:it.title||"", theme:it.theme, where:it.where, duration:it.duration,
            date:it.date||"", time:it.time||"", spot:it.spot||"", until:it.until||"",
            link:it.link||"", note:it.note||"" };
  drawForm();
}

function drawForm(){
  var edit = !!draft.editId;
  var h = '<h2 class="sh">'+(edit?"Изменить":"Новая идея")+'</h2>';
  h += '<div class="fld"><label>Что это</label><input type="text" placeholder="Например: выставка в Царицыне" ' +
       'value="'+esc(draft.title)+'" oninput="dType(\'title\',this.value)">' +
       '<div id="dupHint">'+twinHint()+'</div></div>';

  h += '<div class="fld two"><div><label>Когда</label><input type="date" value="'+esc(draft.date)+'" onchange="dType(\'date\',this.value)"></div>' +
       '<div><label>Время</label><input type="time" value="'+esc(draft.time)+'" onchange="dType(\'time\',this.value)"></div></div>';

  h += '<div class="fld"><label>До какого числа актуально</label><div class="quick">' +
       '<button class="'+(untilIs(7)?"on":"")+'" onclick="dUntil(7)">Неделя</button>' +
       '<button class="'+(untilIs(30)?"on":"")+'" onclick="dUntil(30)">Месяц</button>' +
       '<button class="'+(draft.until&&!untilIs(7)&&!untilIs(30)?"on":"")+'" onclick="togMore()">Дата</button>' +
       '<button class="'+(draft.until?"":"on")+'" onclick="dUntil(0)">Без срока</button>' +
       '</div></div>';

  h += '<div class="fld"><label>Тема <span style="opacity:.6">— можно пропустить</span></label><div class="opts">';
  CFG.themes.forEach(function(t){
    h += '<button class="opt'+(draft.theme===t.id?" on":"")+'" onclick="dSet(\'theme\',\''+t.id+'\')">' +
         '<span style="color:'+(draft.theme===t.id?"#fff":t.color)+'">'+icon(t.id,17,1.8)+'</span>'+esc(t.label)+'</button>';
  });
  h += '</div></div>';

  h += '<div class="fld"><label>Где</label><div class="opts">';
  CFG.places.forEach(function(p){
    h += '<button class="opt'+(draft.where===p.id?" on":"")+'" onclick="dSet(\'where\',\''+p.id+'\')">' +
         icon(PLACE_ICON[p.id]||"other",17,1.8)+esc(p.label)+'</button>';
  });
  h += '</div></div>';

  h += '<div class="fld"><label>Сколько займёт</label><div class="opts">';
  CFG.durations.forEach(function(d){
    h += '<button class="opt'+(draft.duration===d.id?" on":"")+'" onclick="dSet(\'duration\',\''+d.id+'\')">'+esc(d.label)+'</button>';
  });
  h += '</div></div>';

  var open = edit || !!(draft.spot||draft.link||draft.note);
  h += '<button class="more" onclick="togMore()">'+(open?"Свернуть подробности":"Подробнее — место, ссылка, заметка")+'</button>';
  h += '<div id="extra"'+(open?"":' class="hidden"')+'>';
  h += '<div class="fld"><label>Адрес или ориентир</label><input type="text" value="'+esc(draft.spot)+'" placeholder="Кусково" oninput="dType(\'spot\',this.value)"></div>';
  h += '<div class="fld"><label>Актуально до</label><input type="date" value="'+esc(draft.until)+'" onchange="dType(\'until\',this.value)"></div>';
  h += '<div class="fld"><label>Ссылка</label><input type="url" value="'+esc(draft.link)+'" placeholder="t.me/…" oninput="dType(\'link\',this.value)"></div>';
  h += '<div class="fld"><label>Заметка</label><textarea placeholder="Билеты заранее…" oninput="dType(\'note\',this.value)">'+esc(draft.note)+'</textarea></div>';
  h += '</div>';

  var ok = draft.title.trim();
  h += '<button class="save"'+(ok?"":" disabled")+' onclick="saveForm()">'+(edit?"Сохранить":"Добавить в копилку")+'</button>';
  if (edit) h += '<button class="act quiet" style="margin-top:9px" onclick="openCard(\''+draft.editId+'\')">Отмена</button>';
  openSheet(h);
}
function dSet(k,v){ draft[k]=v; haptic(); drawForm(); }
function untilIs(days){ return !!draft.until && draft.until === shift(todayISO(), days); }
function dUntil(days){ draft.until = days ? shift(todayISO(), days) : ""; haptic(); drawForm(); }
function dType(k,v){
  draft[k]=v;
  var b = document.querySelector(".save");
  if (b){ if (draft.title.trim()) b.removeAttribute("disabled"); else b.setAttribute("disabled",""); }
  if (k === "title"){
    var hint = document.getElementById("dupHint");
    if (hint) hint.innerHTML = twinHint();
  }
}
function togMore(){ document.getElementById("extra").classList.toggle("hidden"); }

function saveForm(confirmed){
  var d = draft, edit = !!d.editId;

  if (!confirmed){
    var twin = findTwin(d.title, d.editId);
    if (twin){ askTwin(twin); return; }
  }
  if (edit){
    update(d.editId, function(it){
      it.title = d.title.trim(); it.theme = d.theme||"other"; it.where = d.where; it.duration = d.duration;
      it.date = d.date||null; it.time = d.time||null; it.spot = d.spot||"";
      it.until = d.until||null; it.link = d.link||""; it.note = d.note||"";
    });
    closeSheet(); haptic("medium"); toast("Изменения сохранены");
    if (d.date){ selDay = d.date; weekStart = mondayOf(d.date); }
    render(); return;
  }
  var it = {
    id:"i"+Date.now()+Math.floor(Math.random()*900+100),
    title:d.title.trim(), theme:d.theme||"other", where:d.where, duration:d.duration,
    date:d.date||null, time:d.time||null, spot:d.spot||"",
    until:d.until||null, link:d.link||"", note:d.note||"",
    status:"planned", createdAt:new Date().toISOString()
  };
  items.push(it); Store.set(items); closeSheet(); haptic("medium");
  if (it.date){ selDay = it.date; weekStart = mondayOf(it.date); view = "week"; weekAll = false; }
  toast(it.date ? "Добавлено на "+human(it.date) : "Добавлено в копилку");
  render();
}

function askTwin(twin){
  var h = '<h2 class="sh">Это уже есть</h2>';
  h += '<div class="dupwarn" style="margin:0 0 16px"><i>' + icon("stack",15,1.9) + '</i><span>' +
       'В приложении уже есть <b>' + esc(twin.title) + '</b> — ' + esc(twinWhere(twin)) + '.</span></div>';
  h += '<div class="acts">';
  h += '<button class="act primary" onclick="closeSheet();openCard(\'' + twin.id + '\')">Открыть ту карточку</button>';
  h += '<button class="act" onclick="drawForm()">Вернуться и переименовать</button>';
  h += '<button class="act quiet" onclick="saveForm(true)">Всё равно добавить вторую</button>';
  h += '</div>';
  openSheet(h);
}

/* ═══════════ КАРТОЧКА ═══════════ */
function openCard(id){
  var it = items.filter(function(x){ return x.id===id; })[0];
  if (!it) return;
  haptic();
  var th = theme(it.theme), st = state(it);
  var h = '<div class="dtop"><span class="ic" style="color:'+th.color+';background:'+tint(th.color,.1)+'">' +
          icon(it.theme,24,1.8)+'</span><div><h3>'+esc(it.title)+'</h3><div class="sub">' +
          esc(th.label)+' · '+esc(durLabel(it.duration).toLowerCase())+' · '+esc(placeLabel(it.where).toLowerCase())+
          '</div></div></div>';

  h += '<div class="rows">';
  h += row("Когда", it.date ? human(it.date)+(it.time?", "+it.time:"") : "день не выбран");
  h += row("Где", it.spot);
  h += row("Актуально до", it.until ? human(it.until)+(st==="expired"?" — вышло":"") : "");
  h += row("Заметка", it.note);
  if (it.link) h += '<div class="row"><span class="k">Ссылка</span><span class="v">' +
                    '<a href="'+esc(it.link)+'" target="_blank" rel="noopener">'+esc(it.link)+'</a></span></div>';
  h += '</div><div class="acts">';
  if (st==="done")           h += '<button class="act" onclick="mark(\''+id+'\',\'planned\')">Вернуть в работу</button>';
  else if (st==="cancelled") h += '<button class="act" onclick="mark(\''+id+'\',\'planned\')">Вернуть из архива</button>';
  else {
    h += '<button class="act primary" onclick="mark(\''+id+'\',\'done\')">Сделано</button>';
    h += '<button class="act" onclick="openEdit(\''+id+'\')">'+icon("pencil",17,1.8)+'&nbsp;Изменить</button>';
    h += '<button class="act" onclick="openMove(\''+id+'\')">Перенести</button>';
    h += '<button class="act quiet" onclick="mark(\''+id+'\',\'cancelled\')">Отменить</button>';
  }
  h += '<button class="act quiet" onclick="removeItem(\''+id+'\')">Удалить совсем</button></div>';
  openSheet(h);
}
function row(k,v){ return v ? '<div class="row"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span></div>' : ""; }

function openMove(id){
  var it = items.filter(function(x){ return x.id===id; })[0];
  var h = '<h2 class="sh">Перенести</h2>';
  h += '<div class="fld"><label>На какой день</label><input type="date" id="mvD" value="'+esc(it.date||todayISO())+'"></div>';
  h += '<div class="fld"><label>Время</label><input type="time" id="mvT" value="'+esc(it.time||"")+'"></div>';
  h += '<div class="acts"><button class="act primary" onclick="applyMove(\''+id+'\')">Поставить на этот день</button>' +
       '<button class="act" onclick="toInbox(\''+id+'\')">Убрать дату, вернуть в копилку</button>' +
       '<button class="act quiet" onclick="openCard(\''+id+'\')">Назад</button></div>';
  openSheet(h);
}
function applyMove(id){
  var d = document.getElementById("mvD").value, t = document.getElementById("mvT").value;
  if (!d){ toast("Выбери день"); return; }
  update(id,function(it){ it.date=d; it.time=t||null; it.status="planned"; });
  weekStart = mondayOf(d); selDay = d; view = "week"; weekAll = false; themeFilter = null;
  closeSheet(); toast("Перенесено на "+human(d)); render();
}
function toInbox(id){
  update(id,function(it){ it.date=null; it.time=null; it.status="planned"; });
  closeSheet(); toast("Вернулось в копилку"); render();
}
function celebrate(){
  var colors = ["#F2542D","#FF8A3D","#C9A227","#2F9E6B","#5C6BA8","#D4788C"];
  var i, el, ang, dist;
  for (i=0;i<26;i++){
    el = document.createElement("div");
    el.className = "conf";
    ang  = Math.random()*Math.PI*2;
    dist = 90 + Math.random()*130;
    el.style.background = colors[i % colors.length];
    el.style.setProperty("--dx", Math.round(Math.cos(ang)*dist)+"px");
    el.style.setProperty("--dy", Math.round(Math.sin(ang)*dist - 40)+"px");
    el.style.setProperty("--rot", Math.round(Math.random()*720-360)+"deg");
    el.style.animationDelay = Math.round(Math.random()*90)+"ms";
    document.body.appendChild(el);
  }
  setTimeout(function(){
    var all = document.querySelectorAll(".conf"), k;
    for (k=0;k<all.length;k++) all[k].parentNode.removeChild(all[k]);
  }, 1400);
}

function celebrate(){
  var box = document.createElement("div");
  box.className = "fw";
  var cols = ["#F2542D","#FF8A3D","#D66E4C","#2F9E6B","#C9A227","#5C6BA8"], i, a, r, s;
  for (i=0;i<18;i++){
    a = (Math.PI*2*i)/18 + Math.random()*0.3;
    r = 90 + Math.random()*70;
    s = document.createElement("i");
    s.style.background = cols[i % cols.length];
    s.style.setProperty("--dx", Math.round(Math.cos(a)*r)+"px");
    s.style.setProperty("--dy", Math.round(Math.sin(a)*r - 40)+"px");
    s.style.setProperty("--rot", Math.round(Math.random()*540-270)+"deg");
    s.style.animationDelay = (Math.random()*0.12).toFixed(2)+"s";
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(function(){ if (box.parentNode) box.parentNode.removeChild(box); }, 1500);
}

function mark(id,status){
  update(id,function(it){ it.status=status; });
  closeSheet(); haptic("medium");
  if (status === "done"){ celebrate();
    try{ if(TG&&TG.HapticFeedback) TG.HapticFeedback.notificationOccurred("success"); }catch(e){} }
  if (status==="done") celebrate();
  toast(status==="done" ? "Отмечено" : status==="cancelled" ? "В архиве" : "Вернули");
  render();
}
function removeItem(id){
  var it = items.filter(function(x){ return x.id===id; })[0];
  if (it){
    deleted.push({ id: it.id, key: normKey(it.title) });
    Trash.set(deleted);
  }
  items = items.filter(function(x){ return x.id!==id; });
  Store.set(items); closeSheet(); toast("Удалено"); render();
}

/* ── похожая карточка среди уже добавленных (себя при правке не считаем) ── */
function findTwin(title, exceptId){
  var k = normKey(title);
  if (!k) return null;
  return items.filter(function(it){
    return it.id !== exceptId && normKey(it.title) === k;
  })[0] || null;
}
function twinWhere(it){
  var st = state(it);
  if (st === "done") return "уже отмечена сделанной";
  if (st === "cancelled") return "лежит в архиве";
  if (it.date) return "стоит на " + human(it.date);
  return "лежит в копилке, без даты";
}
function twinHint(){
  if (!draft || !draft.title.trim()) return "";
  var t = findTwin(draft.title, draft.editId);
  if (!t) return "";
  return '<div class="dupwarn"><i>' + icon("stack",15,1.9) + '</i><span>' +
         'Похоже, это уже есть: <b>' + esc(t.title) + '</b> — ' + esc(twinWhere(t)) + '</span></div>';
}

/* ═══════════ ЗАГРУЗКА СПИСКА ═══════════ */
var impDups = false, impDeleted = false, impData = null;

function scanImport(){
  var haveId = {}, haveKey = {}, delId = {}, delKey = {};
  items.forEach(function(it){ haveId[it.id] = 1; haveKey[normKey(it.title)] = it.title; });
  deleted.forEach(function(d){ delId[d.id] = 1; delKey[d.key] = 1; });

  var fresh = [], dups = [], gone = [], exists = 0;
  (CFG.items || []).map(seed).forEach(function(it){
    var k = normKey(it.title);
    if (haveId[it.id]) { exists++; return; }
    if (delId[it.id] || delKey[k]) { gone.push(it); return; }
    if (haveKey[k]) { dups.push({ it: it, same: haveKey[k] }); return; }
    fresh.push(it);
  });
  return { fresh:fresh, dups:dups, gone:gone, exists:exists, total:(CFG.items||[]).length };
}

function openImport(){
  haptic("medium");
  impDups = false; impDeleted = false;
  impData = scanImport();
  drawImport();
}

function drawImport(){
  var d = impData;
  var h = '<h2 class="sh">Загрузить список</h2>';

  h += '<div class="rows">';
  h += '<div class="row"><span class="k">В файле</span><span class="v">' + d.total + ' ' +
       plural(d.total,"карточка","карточки","карточек") + '</span></div>';
  h += '<div class="row"><span class="k">Новых</span><span class="v"><b>' + d.fresh.length + '</b></span></div>';
  h += '<div class="row"><span class="k">Уже есть</span><span class="v">' + d.exists + '</span></div>';
  if (d.dups.length)
    h += '<div class="row"><span class="k">Похожих</span><span class="v">' + d.dups.length + ' по названию</span></div>';
  if (d.gone.length)
    h += '<div class="row"><span class="k">Удалённых</span><span class="v">' + d.gone.length + ' — не вернутся</span></div>';
  h += '</div>';

  if (d.dups.length){
    h += '<button class="act' + (impDups ? " primary" : "") + '" onclick="togImpDups()">' +
         (impDups ? "Похожие будут добавлены" : "Похожие пропустить") + '</button>';
    h += '<div class="dups">' + d.dups.slice(0,6).map(function(x){
      return '<div class="dup"><b>' + esc(x.it.title) + '</b><span>у тебя уже: ' + esc(x.same) + '</span></div>';
    }).join("") + (d.dups.length > 6 ? '<div class="dup"><span>…и ещё ' + (d.dups.length-6) + '</span></div>' : "") + '</div>';
  }

  if (d.gone.length){
    h += '<button class="act' + (impDeleted ? " primary" : "") + '" style="margin-top:9px" onclick="togImpDeleted()">' +
         (impDeleted ? "Удалённые тоже вернутся" : "Удалённые не трогать") + '</button>';
  }

  var n = d.fresh.length + (impDups ? d.dups.length : 0) + (impDeleted ? d.gone.length : 0);
  h += '<button class="save" style="margin-top:14px"' + (n ? "" : " disabled") + ' onclick="doImport()">' +
       (n ? "Добавить " + n + " " + plural(n,"карточку","карточки","карточек") : "Добавлять нечего") + '</button>';
  h += '<button class="act quiet" style="margin-top:9px" onclick="closeSheet()">Отмена</button>';
  openSheet(h);
}
function togImpDups(){ impDups = !impDups; haptic(); drawImport(); }
function togImpDeleted(){ impDeleted = !impDeleted; haptic(); drawImport(); }

function doImport(){
  var d = impData, add = d.fresh.slice();
  if (impDups) d.dups.forEach(function(x){ add.push(x.it); });
  if (impDeleted){
    add = add.concat(d.gone);
    var back = {};
    d.gone.forEach(function(it){ back[it.id] = 1; back[normKey(it.title)] = 1; });
    deleted = deleted.filter(function(x){ return !back[x.id] && !back[x.key]; });
    Trash.set(deleted);
  }
  if (!add.length){ toast("Нечего добавлять"); return; }

  var used = {};
  items.forEach(function(it){ used[it.id] = 1; });
  add.forEach(function(it){
    if (used[it.id]) it.id = it.id + "-" + Math.floor(Math.random()*900+100);
    used[it.id] = 1;
    items.push(it);
  });
  Store.set(items);
  closeSheet(); haptic("medium");
  toast("Добавлено " + add.length + " " + plural(add.length,"карточка","карточки","карточек"));
  view = "inbox"; opened = {}; render();
}
function update(id,fn){ items.forEach(function(it){ if(it.id===id) fn(it); }); Store.set(items); }

window.__taymautOK = true;
startSafe();
